# VisionGuard Component Vocabulary for Open-Vocabulary Detection
# Each entry defines:
#   name: identifier
#   prompts: list of natural language text prompts for zero-shot detectors (OWL-ViT, Grounding DINO, YOLO-World)
#   category: ic | board | passive | semiconductor | connector | switch | module
#   mapped_wiring_type: optional mapped Circuit JSON part type (led | resistor | pushbutton | arduino-uno | null)

components:
  - name: microcontroller
    prompts: ["microcontroller", "MCU chip", "microcontroller IC", "microcontroller chip"]
    category: ic
    mapped_wiring_type: null

  - name: arduino_board
    prompts: ["Arduino board", "Arduino Uno", "Arduino microcontroller board", "blue development board"]
    category: board
    mapped_wiring_type: arduino-uno

